openapi: 3.0.3
info:
  title: Cocktail REST API
  version: 1.0.0
  description: API for managing cocktails and ingredients
paths:
  /api/cocktails/:
    get:
      operationId: cocktails_list
      description: Lista koktajli z filtrowaniem, sortowaniem i paginacją.
      summary: Pobierz listę koktajli
      parameters:
      - in: query
        name: count
        schema:
          type: integer
      - in: query
        name: ingredient
        schema:
          type: string
      - in: query
        name: max_count
        schema:
          type: integer
      - in: query
        name: min_count
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -count
          - -id
          - -name
          - count
          - id
          - name
      tags:
      - cocktails
      security:
      - cookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cocktail'
          description: ''
    post:
      operationId: cocktails_create
      description: Tworzy nowy koktajl. Wymaga zalogowania.
      summary: Dodaj nowy koktajl
      tags:
      - cocktails
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cocktail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cocktail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cocktail'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cocktail'
          description: ''
  /api/cocktails/{id}/:
    get:
      operationId: cocktails_retrieve
      description: Zwraca koktajl o wskazanym ID. Dostępny dla wszystkich.
      summary: Pobierz szczegóły koktajlu
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cocktails
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cocktail'
          description: ''
    put:
      operationId: cocktails_update
      description: Zastępuje dane koktajlu. Wymaga uprawnień administratora.
      summary: Zaktualizuj cały koktajl
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cocktails
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cocktail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Cocktail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Cocktail'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cocktail'
          description: ''
    patch:
      operationId: cocktails_partial_update
      description: Aktualizuje wybrane pola. Wymaga uprawnień administratora.
      summary: Częściowo zaktualizuj koktajl
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cocktails
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCocktail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCocktail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCocktail'
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cocktail'
          description: ''
    delete:
      operationId: cocktails_destroy
      description: Usuwa koktajl. Wymaga uprawnień administratora.
      summary: Usuń koktajl
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cocktails
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/register/:
    post:
      operationId: register_create
      description: Tworzy nowe konto użytkownika.
      summary: Zarejestruj użytkownika
      tags:
      - register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
